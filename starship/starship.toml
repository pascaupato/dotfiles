# ~/.config/starship.toml

# Prompt format - order matters!
format = """
[╭─](blue) \
$directory\
$git_branch\
$git_status\
$python\
$golang\
$cmd_duration\
$line_break\
[╰─](blue) $status$character"""

# Timeout for starship (ms)
command_timeout = 500

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"

[directory]
style = "bold cyan"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
symbol = "\ue725 "  # Nerd Font git branch icon (nf-dev-git_branch)
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "\uf0e7 "  # nf-fa-bolt
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "\uf01c "  # nf-fa-inbox
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[python]
symbol = "\ue73c "  # Nerd Font python icon (nf-dev-python)
style = "bold blue"
format = 'via [$symbol$virtualenv]($style) '
detect_extensions = []
detect_files = [".python-version", "Pipfile", "pyproject.toml", "requirements.txt"]
detect_folders = []

[golang]
symbol = "\ue627 "  # Nerd Font go gopher icon (nf-dev-go)
style = "bold cyan"
format = "via [$symbol$version]($style) "
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum"]
detect_folders = []

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "took [$duration]($style) "
show_milliseconds = false

[status]
disabled = false
format = "[$symbol]($style) "
success_symbol = "[✓](bold green)"
symbol = "[✗](bold red)"
map_symbol = false

[line_break]
disabled = false
